<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif" role="img" aria-label="Data that listens. Automation that ships."><title>Data that listens. Automation that ships.</title><defs><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f5f0e6"/></linearGradient><linearGradient id="hl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e2492b"/><stop offset="1" stop-color="#f0783a"/></linearGradient><radialGradient id="glowA"><stop offset="0" stop-color="#e2492b" stop-opacity=".22"/><stop offset="1" stop-color="#e2492b" stop-opacity="0"/></radialGradient><radialGradient id="glowB"><stop offset="0" stop-color="#0f7c80" stop-opacity=".22"/><stop offset="1" stop-color="#0f7c80" stop-opacity="0"/></radialGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#ffffff" fill-opacity=".09"/></pattern><linearGradient id="close" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1c1646"/><stop offset=".5" stop-color="#132447"/><stop offset="1" stop-color="#0d3440"/></linearGradient></defs><rect x="0.5" y="0.5" width="999" height="199" rx="28" fill="#17191e" stroke="#17191e"/><clipPath id="cc"><rect x="1" y="1" width="998" height="198" rx="28"/></clipPath><g clip-path="url(#cc)"><rect width="1000" height="200" fill="url(#dots)"/><circle cx="160" cy="0" r="200" fill="url(#glowA)"/><circle cx="860" cy="200" r="200" fill="url(#glowB)"/></g><text x="500.0" y="86.0" fill="#ffffff" font-size="30" font-weight="800" text-anchor="middle">Data that listens. Automation that ships.</text><text x="500.0" y="122.0" fill="#aeb2bc" font-size="15" font-weight="400" text-anchor="middle">From customer reviews to dashboards to AI agents: systems that turn noise into decisions.</text><text x="500.0" y="158.0" fill="#f2